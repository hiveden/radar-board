<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Push Intelligence - Signal Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: dark;
  --mono: ui-monospace, 'SF Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  --bg: #0f1117;
  --surface: #161b22;
  --surface-inset: #0d1117;
  --border: #21262d;
  --border-bright: #30363d;

  --text: #e6edf3;
  --text-2: #8b949e;
  --text-3: #484f58;

  --fire:  #f0883e;
  --bolt:  #58a6ff;
  --bulb:  #3fb950;
  --red:   #f85149;
  --yellow: #ffd33d;
  --ref:   #6e7681;

  --watch-color:   #ffd33d;
  --discuss-color: #58a6ff;
  --confirm-color: #3fb950;
  --dismiss-color: #da3633;

  --active-bg: #1f6feb;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'PingFang SC', 'SF Pro Text', 'Inter', sans-serif;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body[data-product="radar"] {
  background:
    radial-gradient(1100px 480px at 82% -140px, rgba(88,166,255,.05), transparent 65%),
    radial-gradient(820px 420px at -5% -80px, rgba(240,136,62,.04), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
body[data-product="pulse"] {
  background:
    radial-gradient(1100px 480px at 82% -140px, rgba(88,166,255,.05), transparent 65%),
    radial-gradient(820px 420px at -5% -80px, rgba(248,81,73,.035), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}

/* ── Header ── */
.top-chrome {
  position: sticky;
  top: 0;
  z-index: 100;
}
.header {
  background: rgba(15,17,23,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.header-logo { font-size: 22px; }
.product-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  border-radius: 6px;
  padding: 3px 7px;
  border: 1px solid transparent;
}
body[data-product="radar"] .product-badge {
  color: #79c0ff;
  background: rgba(88,166,255,.12);
  border-color: rgba(88,166,255,.28);
}
body[data-product="pulse"] .product-badge {
  color: #ff7b72;
  background: rgba(248,81,73,.12);
  border-color: rgba(248,81,73,.28);
}
.header-copy {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.header-title { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.2; }
.header-subtitle { font-size: 12px; color: var(--text-3); line-height: 1.2; white-space: nowrap; }
.header-meta { font-size: 12px; color: var(--text-3); margin-left: auto; }

/* ── Filter bar ── */
.filter-bar {
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  background: rgba(15,17,23,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.filter-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.chips-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.chip-divider {
  width: 1px;
  height: 18px;
  background: var(--border-bright);
  margin: 0 2px;
  flex-shrink: 0;
}
.fchip {
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--border-bright);
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.fchip:hover { border-color: var(--text-3); color: var(--text); }
.fchip.active { background: var(--active-bg); border-color: var(--active-bg); color: #fff; font-weight: 600; }
.cat-chip {
  padding: 4px 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-3);
  font-size: 11px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.cat-chip:hover { border-color: var(--text-3); color: var(--text-2); }
.cat-chip.active { background: rgba(88,166,255,.12); border-color: rgba(88,166,255,.4); color: #58a6ff; font-weight: 600; }
#catChips {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent);
  mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent);
}
#catChips::-webkit-scrollbar { display: none; }
#catChips .cat-chip { flex-shrink: 0; }
.search {
  margin-left: auto;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-bright);
  background: var(--surface-inset);
  color: var(--text);
  font-size: 13px;
  outline: none;
  width: 200px;
  transition: border-color .15s, width .2s ease, box-shadow .15s;
  flex-shrink: 0;
}
.search:focus { border-color: var(--active-bg); box-shadow: 0 0 0 3px rgba(31,111,235,.15); }
@media (min-width: 641px) {
  .search:focus { width: 260px; }
}
.search::placeholder { color: var(--text-3); }

/* ── Stats ── */
.statsbar {
  padding: 8px 24px;
  display: flex;
  gap: 20px;
  font-size: 12px;
  color: var(--text-3);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.statsbar b { color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.statsbar .stat-end { margin-left: auto; }

/* ── Grid ── */
.grid-wrap { padding: 20px 24px; }
.date-label {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--mono);
  color: var(--text-3);
  letter-spacing: .08em;
  margin-bottom: 14px;
  margin-top: 6px;
}
.date-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-bright), transparent);
}
.time-label {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-3);
  margin-bottom: 10px;
  padding-left: 4px;
  opacity: .7;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  overflow: hidden;
  position: relative;
  content-visibility: auto;
  contain-intrinsic-size: auto 340px;
}
.card:hover {
  border-color: var(--border-bright);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.card--link { cursor: pointer; }

/* grade accent bar */
.card::before {
  content: '';
  display: block;
  height: 3px;
  width: 100%;
  flex-shrink: 0;
}
.card.grade-fire::before   { background: linear-gradient(90deg, var(--fire) 30%, rgba(240,136,62,.15)); }
.card.grade-bolt::before   { background: linear-gradient(90deg, var(--bolt) 30%, rgba(88,166,255,.15)); }
.card.grade-bulb::before   { background: linear-gradient(90deg, var(--bulb) 30%, rgba(63,185,80,.15)); }
.card.grade-red::before    { background: linear-gradient(90deg, var(--red) 30%, rgba(248,81,73,.15)); }
.card.grade-yellow::before { background: linear-gradient(90deg, var(--yellow) 30%, rgba(255,211,61,.15)); }
.card.grade-blue::before   { background: linear-gradient(90deg, var(--ref) 30%, rgba(110,118,129,.12)); }

/* status border */
.card.st-watching  { border-color: rgba(255,211,61,.5); box-shadow: inset 0 0 0 1px rgba(255,211,61,.22); }
.card.st-discussed { border-color: rgba(88,166,255,.5); box-shadow: inset 0 0 0 1px rgba(88,166,255,.22); }
.card.st-confirmed { border-color: rgba(63,185,80,.5); box-shadow: inset 0 0 0 1px rgba(63,185,80,.22); }
.card.st-dismissed { opacity: .35; filter: grayscale(.4); }
.card.st-dismissed:hover { opacity: .9; filter: none; }

.card-body { padding: 16px 16px 0; flex: 1; }
.card-body > :last-child { margin-bottom: 16px; }

.card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
.card-head-left { display: flex; align-items: center; min-width: 0; }
.card-sid { font-size: 11px; font-weight: 600; color: var(--text-2); margin-right: 6px; font-family: var(--mono); }
.card-time { font-size: 11px; color: var(--text-3); font-family: var(--mono); flex-shrink: 0; }

/* grade badge */
.grade-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 3px 9px;
  border-radius: 5px;
}
.grade-badge.fire   { background: rgba(240,136,62,.12); color: var(--fire); }
.grade-badge.bolt   { background: rgba(88,166,255,.12); color: var(--bolt); }
.grade-badge.bulb   { background: rgba(63,185,80,.12); color: var(--bulb); }
.grade-badge.red    { background: rgba(248,81,73,.12); color: var(--red); }
.grade-badge.yellow { background: rgba(255,211,61,.12); color: var(--yellow); }
.grade-badge.blue   { background: rgba(110,118,129,.2); color: var(--text-2); }

/* push count badge */
.push-count {
  font-size: 10px;
  font-weight: 700;
  color: var(--red);
  background: rgba(248,81,73,.1);
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
}

/* status badge（pushed/skipped 等数据侧状态）*/
.status-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
}
.status-badge.pushed  { background: rgba(63,185,80,.1); color: #3fb950; }
.status-badge.skipped { background: rgba(72,79,88,.2); color: var(--text-3); }

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
  margin-top: 10px;
  margin-bottom: 9px;
  text-decoration: none;
  display: block;
}
a.card-title:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }

.card-desc {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.7;
  margin-bottom: 10px;
}

/* why 块 */
.card-why {
  font-size: 13px;
  color: var(--text-2);
  background: var(--surface-inset);
  border-left: 2px solid var(--border-bright);
  padding: 8px 12px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 12px;
  line-height: 1.7;
}
.card-why-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.card-alex {
  font-size: 12px;
  color: #d2a8ff;
  background: rgba(210,168,255,.08);
  border: 1px solid rgba(210,168,255,.18);
  padding: 7px 10px;
  border-radius: 6px;
  margin-bottom: 10px;
}
.card-alex b {
  color: #f0d6ff;
  margin-right: 6px;
}

/* tags row */
.card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.ctag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface-inset);
  color: var(--text-2);
  border: 1px solid var(--border);
}
.ctag.new    { color: var(--bulb); border-color: rgba(63,185,80,.25); }
.ctag.stars  { color: #ffd33d; border-color: rgba(255,211,61,.25); }
.ctag.source { color: var(--bolt); border-color: rgba(88,166,255,.25); }

/* domain tag + source row（pulse）*/
.card-domain {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface-inset);
  color: var(--text-2);
  border: 1px solid var(--border);
  display: inline-block;
  margin-bottom: 10px;
}
.card-source {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 10px;
}
.card-source a { color: #58a6ff; text-decoration: none; }
.card-source a:hover { text-decoration: underline; }

/* detail toggle */
.card-expand-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: #58a6ff;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  margin-bottom: 10px;
  transition: color .12s;
}
.card-expand-toggle:hover { color: #79c0ff; }

/* action bar */
.card-actions {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
}
.action-btn {
  padding: 4px 11px;
  border-radius: 6px;
  border: 1px solid var(--border-bright);
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.action-btn:hover { border-color: var(--text-3); color: var(--text); background: rgba(255,255,255,.04); }
.action-btn.on-watch   { border-color: rgba(255,211,61,.5);  background: rgba(255,211,61,.08);  color: var(--watch-color); }
.action-btn.on-discuss { border-color: rgba(88,166,255,.5);  background: rgba(88,166,255,.08);  color: var(--discuss-color); }
.action-btn.on-confirm { border-color: rgba(63,185,80,.5);   background: rgba(63,185,80,.08);   color: var(--confirm-color); }
.action-btn.on-dismiss { border-color: rgba(218,54,51,.5);   background: rgba(218,54,51,.08);   color: var(--dismiss-color); }
.card-link {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-3);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 3px;
  transition: color .12s;
}
.card-link:hover { color: var(--text-2); }

.empty { text-align: center; padding: 64px 24px; color: var(--text-3); font-size: 14px; border: 1px dashed var(--border-bright); border-radius: 12px; margin-bottom: 28px; }

/* ── Drawer ── */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s ease, visibility .3s ease;
}
.drawer-backdrop.open { opacity: 1; visibility: visible; }
.drawer-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 480px;
  height: 100vh;
  z-index: 1000;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -4px 0 24px rgba(0,0,0,.4);
  transform: translateX(100%);
  transition: transform .3s ease;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.drawer-panel.open { transform: translateX(0); }
.drawer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.drawer-header-info { flex: 1; min-width: 0; }
.drawer-header-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 8px;
}
.drawer-header-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.drawer-header-source { font-size: 12px; color: var(--text-3); }
.drawer-header-source a { color: #58a6ff; text-decoration: none; }
.drawer-header-source a:hover { text-decoration: underline; }
.drawer-close {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--border-bright);
  background: transparent;
  color: var(--text-2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
}
.drawer-close:hover { background: rgba(255,255,255,.06); color: var(--text); }
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}
.drawer-body .deep-section { margin-bottom: 16px; }
.drawer-body .deep-section:last-child { margin-bottom: 0; }
.deep-section {
  border-left: 4px solid var(--border);
  padding: 8px 0 8px 14px;
  margin-bottom: 10px;
}
.deep-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .03em;
  margin-bottom: 4px;
}
.deep-section-body { font-size: 13px; color: var(--text-2); }
.deep-section-body ul { padding-left: 16px; }
.deep-section-body li { margin-bottom: 6px; }
.deep-section.s-tldr     { border-color: #58a6ff; }
.deep-section.s-signal   { border-color: #3fb950; }
.deep-section.s-analysis { border-color: #d2a8ff; }
.deep-section.s-impact   { border-color: #f85149; }
.deep-section.s-sources  { border-color: #8b949e; }
.deep-section.s-related  { border-color: #f0883e; }
.deep-source-item {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 4px;
}
.deep-source-item:last-child { margin-bottom: 0; }
.deep-source-type {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(255,255,255,.06);
  color: var(--text-3);
  text-transform: uppercase;
  flex-shrink: 0;
}
.deep-source-item a { color: #58a6ff; text-decoration: none; font-size: 13px; }
.deep-source-item a:hover { text-decoration: underline; }
.deep-source-note { font-size: 12px; color: var(--text-3); }
.deep-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.deep-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(88,166,255,.1);
  color: #58a6ff;
  border: 1px solid rgba(88,166,255,.2);
}
.deep-related-id {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: #f0883e;
  background: rgba(240,136,62,.1);
  padding: 2px 8px;
  border-radius: 4px;
  margin-right: 6px;
  margin-bottom: 4px;
}

/* ── Polish: focus / scrollbar / motion ── */
:focus-visible { outline: 2px solid var(--active-bg); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

@keyframes card-in {
  from { opacity: 0; transform: translateY(8px); }
}
.anim-on .grid .card { animation: card-in .35s cubic-bezier(.16,.84,.44,1) backwards; }
.anim-on .grid .card:nth-child(2) { animation-delay: .05s; }
.anim-on .grid .card:nth-child(3) { animation-delay: .1s; }
.anim-on .grid .card:nth-child(4) { animation-delay: .15s; }
.anim-on .grid .card:nth-child(n+5) { animation-delay: .2s; }

@keyframes card-flash {
  0%, 100% { box-shadow: none; }
  30% { box-shadow: 0 0 0 2px var(--active-bg); }
}
.card-flash { animation: card-flash 1.6s ease 1; }

/* ── Undo toast ── */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(8px);
  z-index: 1100;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13px;
  color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
  max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; visibility: visible; transform: translateX(-50%); }
.toast-undo {
  background: none;
  border: none;
  cursor: pointer;
  color: #58a6ff;
  font-size: 13px;
  font-weight: 600;
  padding: 0;
  flex-shrink: 0;
}
.toast-undo:hover { text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── Drawer responsive ── */
@media (max-width: 768px) {
  .drawer-panel {
    width: 100%;
    top: auto;
    bottom: 0;
    height: 85vh;
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
  }
  .drawer-panel.open { transform: translateY(0); }
}

/* ── Responsive ── */
@media (max-width: 640px) {

// ═══ Board engine（_base.html 共享，radar/pulse 通过 BOARD_CONFIG 差异化）═══
const C = BOARD_CONFIG;

const STATES = [
  { key: 'watching',  chip: '👀 关注中', action: '👀 关注', on: 'on-watch' },
  { key: 'discussed', chip: '💬 讨论中', action: '💬 讨论', on: 'on-discuss' },
  { key: 'confirmed', chip: '✓ 已确认',  action: '✓ 确认',  on: 'on-confirm' },
  { key: 'dismissed', chip: '已忽略',    action: '✕ 忽略',  on: 'on-dismiss' },
];

// ─── State ──────────────────────────────────────────────────────────────────
const SK = C.storageKey, SF = C.stateField;
let S = JSON.parse(localStorage.getItem(SK) || '{}');
if (C.migrate) C.migrate(S);
if (C.seedState) {
  DATA.forEach(d => {
    const seed = C.seedState(d);
    if (!S[d.id] && seed && seed !== 'unread') S[d.id] = { [SF]: seed };
  });
}
localStorage.setItem(SK, JSON.stringify(S));
const getS = id => (S[id] || {})[SF] || 'unread';
const setS = (id, st) => { S[id] = { [SF]: st }; localStorage.setItem(SK, JSON.stringify(S)); };

// ─── Filter ─────────────────────────────────────────────────────────────────
let curFilter = 'all', curCat = '', curQ = '';
const FALLBACK_GRADE = C.grades.find(g => g.fallback) || C.grades[C.grades.length - 1];
const gradeOf = d => C.grades.find(g => g.emoji === d.grade) || FALLBACK_GRADE;
const catsOf = d => C.categoriesOf(d) || [];

function matches(d) {
  if (curFilter !== 'all') {
    const st = getS(d.id);
    if (curFilter === 'unread') { if (st !== 'unread') return false; }
    else if (STATES.some(s => s.key === curFilter)) { if (st !== curFilter) return false; }
    else {
      const x = (C.extraChips || []).find(x => x.key === curFilter);
      if (x) { if (!x.match(d)) return false; }
      else if (gradeOf(d).key !== curFilter) return false;
    }
  }
  if (curCat && !catsOf(d).includes(curCat)) return false;
  if (curQ && !C.searchHay(d).toLowerCase().includes(curQ.toLowerCase())) return false;
  return true;
}

// ─── URL state ──────────────────────────────────────────────────────────────
let lastFocus = null, openCardId = '';
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  return {
    f: h.get('f') || 'all',
    q: h.get('q') || '',
    cat: h.get('cat') || h.get('domain') || '',
    card: h.get('card') || '',
  };
}
function writeHash() {
  const h = new URLSearchParams();
  if (curFilter !== 'all') h.set('f', curFilter);
  if (curQ) h.set('q', curQ);
  if (curCat) h.set('cat', curCat);
  if (openCardId) h.set('card', openCardId);
  const s = h.toString();
  history.replaceState(null, '', s ? '#' + s : location.pathname + location.search);
}

// ─── Undo toast ─────────────────────────────────────────────────────────────
let toastTimer = null, undoFn = null;
function showToast(msg, onUndo) {
  document.getElementById('toastMsg').textContent = msg;
  undoFn = onUndo;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
}

// ─── Chips / Stats ──────────────────────────────────────────────────────────
function buildMainChips() {
  const defs = [
    { key: 'all', label: '全部' },
    ...C.grades.map(g => ({ key: g.key, label: g.label })),
    ...(C.extraChips || []).map(x => ({ key: x.key, label: x.label })),
    { divider: true },
    { key: 'unread', label: '待处理' },
    ...STATES.map(s => ({ key: s.key, label: s.chip })),
  ];
  document.getElementById('mainChips').innerHTML = defs.map(d =>
    d.divider ? '<span class="chip-divider"></span>'
      : `<button class="fchip" data-f="${d.key}" aria-pressed="false">${d.label}</button>`
  ).join('');
  document.querySelectorAll('[data-f]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-f]').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      curFilter = btn.dataset.f;
      render();
    });
  });
}

function buildCatChips() {
  const counts = {};
  DATA.forEach(d => catsOf(d).forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
  const cats = Object.keys(counts)
    .filter(c => counts[c] >= (C.minCatCount || 1))
    .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  const container = document.getElementById('catChips');
  container.innerHTML = cats.map(c =>
    `<button class="cat-chip" data-cat="${c}" aria-pressed="false">${c}</button>`
  ).join('');
  container.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const active = btn.classList.contains('active');
      container.querySelectorAll('.cat-chip').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
      if (!active) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); curCat = btn.dataset.cat; }
      else { curCat = ''; }
      render();
    });
  });
}

function buildStatsbar() {
  const defs = [
    ...C.grades.map(g => ({ key: g.key, label: g.label })),
    ...(C.extraChips || []).map(x => ({ key: x.key, label: x.label })),
    { key: 'unread', label: '待处理' },
    ...STATES.map(s => ({ key: s.key, label: s.chip })),
  ];
  document.getElementById('statsbar').innerHTML =
    `<span>共 <b data-stat="total">0</b> 条</span>` +
    defs.map(d => `<span>${d.label} <b data-stat="${d.key}">0</b></span>`).join('') +
    `<span class="stat-end">显示 <b data-stat="shown">0</b> 条</span>`;
}

function statCount(key) {
  if (key === 'total') return DATA.length;
  if (key === 'unread' || STATES.some(s => s.key === key)) return DATA.filter(d => getS(d.id) === key).length;
  const x = (C.extraChips || []).find(x => x.key === key);
  if (x) return DATA.filter(x.match).length;
  return DATA.filter(d => gradeOf(d).key === key).length;
}

function updateStats() {
  document.querySelectorAll('[data-stat]').forEach(el => {
    if (el.dataset.stat !== 'shown') el.textContent = statCount(el.dataset.stat);
  });
  const hasTime = DATA.some(d => d.time);
  const latest = DATA.map(d => hasTime ? `${d.date} ${d.time || ''}`.trim() : d.date)
    .sort((a, b) => b.localeCompare(a))[0] || '';
  document.getElementById('metaText').textContent =
    latest ? `${hasTime ? '最后同步' : '最新批次'}：${latest}` : '暂无数据';
}

// ─── Render ─────────────────────────────────────────────────────────────────
const dateFmt = new Intl.DateTimeFormat('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
const toLocalISO = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;

function dateLabel(date, count) {
  const today = toLocalISO(new Date());
  const yesterday = toLocalISO(new Date(Date.now() - 86400000));
  const day = date === today ? '今天 · ' : date === yesterday ? '昨天 · ' : '';
  return `${day}${dateFmt.format(new Date(date + 'T00:00:00'))} · ${count} 条`;
}

function render() {
  updateStats();
  writeHash();
  const wrap = document.getElementById('gridWrap');
  const ae = document.activeElement;
  const refocus = ae && wrap.contains(ae) ? { act: ae.dataset.act, id: ae.dataset.id, expand: ae.dataset.expand } : null;
  const filtered = DATA.filter(matches);
  document.querySelector('[data-stat="shown"]').textContent = filtered.length;

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty">没有符合条件的条目</div>';
    return;
  }

  const byDate = {};
  filtered.forEach(d => { (byDate[d.date] || (byDate[d.date] = [])).push(d); });
  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
  const useTime = C.groupTime && filtered.some(d => d.time);

  wrap.innerHTML = dates.map(date => {
    const items = byDate[date];
    const label = `<div class="date-label">${dateLabel(date, items.length)}</div>`;
    if (!useTime) return label + `<div class="grid">${items.map(cardHTML).join('')}</div>`;
    const byTime = {};
    items.forEach(d => { (byTime[d.time || ''] || (byTime[d.time || ''] = [])).push(d); });
    const times = Object.keys(byTime).sort((a, b) => b.localeCompare(a));
    return label + times.map(time =>
      `${time ? `<div class="time-label">${time} 采集</div>` : ''}<div class="grid">${byTime[time].map(cardHTML).join('')}</div>`
    ).join('');
  }).join('');

  bindEvents(wrap);
  if (refocus) {
    const sel = refocus.act ? `[data-act="${refocus.act}"][data-id="${refocus.id}"]`
              : refocus.expand ? `[data-expand="${refocus.expand}"]` : null;
    const el = sel && wrap.querySelector(sel);
    if (el) el.focus({ preventScroll: true });
  }
}

function cardHTML(d) {
  const st = getS(d.id);
  const g = gradeOf(d);
  const stCls = STATES.some(s => s.key === st) ? ` st-${st}` : '';
  const hasDetail = C.hasDetail(d);
  const url = C.titleUrl(d);
  const headRight = C.headRight(d);
  return `
<div class="card grade-${g.key}${stCls}${hasDetail ? ' card--link' : ''}" id="card-${d.id}">
  <div class="card-body">
    <div class="card-head">
      <div class="card-head-left">${C.headLeft(d)}<div class="grade-badge ${g.key}">${g.label}</div>${C.headBadges(d)}</div>
      ${headRight ? `<span class="card-time">${headRight}</span>` : ''}
    </div>
    ${url ? `<a class="card-title" href="${url}" target="_blank" rel="noopener">${d.title}</a>` : `<span class="card-title">${d.title}</span>`}
    <div class="card-desc">${C.desc(d) || ''}</div>
    ${C.cardSections(d)}
    ${C.tagsHTML(d)}
    ${hasDetail ? `<button class="card-expand-toggle" data-expand="${d.id}" aria-haspopup="dialog">查看分析 →</button>` : ''}
  </div>
  <div class="card-actions">
    ${STATES.map(s => `<button class="action-btn${st === s.key ? ' ' + s.on : ''}" data-act="${s.key}" data-id="${d.id}">${s.action}</button>`).join('')}
    ${url ? `<a class="card-link" href="${url}" target="_blank" rel="noopener">打开 ↗</a>` : ''}
  </div>
</div>`;
}

function bindEvents(wrap) {
  wrap.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const { id, act } = btn.dataset;
      const prev = getS(id);
      const next = prev === act ? 'unread' : act;
      const label = btn.textContent.trim();
      setS(id, next);
      render();
      const d = DATA.find(x => x.id === id);
      if (d && !matches(d)) {
        const msg = next === 'unread' ? `已取消「${label}」标记，卡片移出当前视图` : `已标记「${label}」，卡片移出当前视图`;
        showToast(msg, () => { setS(id, prev); render(); });
      }
    });
  });
  wrap.querySelectorAll('[data-expand]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const d = DATA.find(item => item.id === btn.dataset.expand);
      if (d) openDrawer(d);
    });
  });
  wrap.querySelectorAll('.card--link').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('a, button')) return;
      const d = DATA.find(item => 'card-' + item.id === card.id);
      if (d) openDrawer(d);
    });
  });
}

// ─── Drawer ─────────────────────────────────────────────────────────────────
function openDrawer(d) {
  document.getElementById('drawerTitle').textContent = C.drawerTitle(d);
  document.getElementById('drawerMeta').innerHTML = C.drawerMeta(d);
  document.getElementById('drawerBody').innerHTML = C.drawerBody(d);
  lastFocus = document.activeElement;
  openCardId = C.deepLinkId(d);
  writeHash();
  document.getElementById('drawerPanel').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('drawerClose').focus();
}

function closeDrawer() {
  if (!document.getElementById('drawerPanel').classList.contains('open')) return;
  document.getElementById('drawerPanel').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
  document.body.style.overflow = '';
  openCardId = '';
  writeHash();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  const panel = document.getElementById('drawerPanel');
  const searchEl = document.getElementById('searchInput');
  if (e.key === 'Escape') {
    if (panel.classList.contains('open')) { closeDrawer(); return; }
    if (document.activeElement === searchEl && searchEl.value) { searchEl.value = ''; curQ = ''; render(); }
    return;
  }
  if (e.key === '/' && !panel.classList.contains('open') && document.activeElement !== searchEl) {
    e.preventDefault(); searchEl.focus(); return;
  }
  if (e.key === 'Tab' && panel.classList.contains('open')) {
    const f = panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ─── Global events ──────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  curQ = e.target.value;
  render();
});
document.getElementById('toastUndo').addEventListener('click', () => {
  if (undoFn) undoFn();
  undoFn = null;
  clearTimeout(toastTimer);
  document.getElementById('toast').classList.remove('show');
});
window.addEventListener('storage', e => {
  if (e.key === SK) { S = JSON.parse(e.newValue || '{}'); render(); }
});

// ─── Init（含 URL 状态恢复）──────────────────────────────────────────────────
document.getElementById('productBadge').textContent = C.badge;
document.getElementById('boardTitle').textContent = C.title;
document.getElementById('boardSubtitle').textContent = C.subtitle;
document.getElementById('searchInput').placeholder = C.searchPlaceholder;

buildMainChips();
buildCatChips();
buildStatsbar();

const initState = readHash();
if ([...document.querySelectorAll('[data-f]')].some(b => b.dataset.f === initState.f)) curFilter = initState.f;
curQ = initState.q;
document.getElementById('searchInput').value = curQ;
document.querySelectorAll('[data-f]').forEach(b => {
  const on = b.dataset.f === curFilter;
  b.classList.toggle('active', on);
  b.setAttribute('aria-pressed', String(on));
});
if (initState.cat) {
  const cbtn = [...document.querySelectorAll('.cat-chip')].find(b => b.dataset.cat === initState.cat);
  if (cbtn) { cbtn.classList.add('active'); cbtn.setAttribute('aria-pressed', 'true'); curCat = initState.cat; }
}

document.body.classList.add('anim-on');
render();
setTimeout(() => document.body.classList.remove('anim-on'), 800);

if (initState.card) {
  const d0 = DATA.find(x => C.deepLinkId(x) === initState.card || x.id === initState.card);
  if (d0) {
    const el = document.getElementById('card-' + d0.id);
    if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('card-flash'); }
    if (C.hasDetail(d0)) openDrawer(d0);
  }
}
</script>
</body>
</html>
